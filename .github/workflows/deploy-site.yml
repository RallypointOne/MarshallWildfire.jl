name: Deploy Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Install xvfb and OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Cache Julia packages
        uses: actions/cache@v5
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-

      - name: Cache downloaded data
        uses: actions/cache@v5
        with:
          path: data
          key: ${{ runner.os }}-data-v1
          restore-keys: |
            ${{ runner.os }}-data-

      - name: Cache generated plots
        uses: actions/cache@v5
        with:
          path: report/images
          key: ${{ runner.os }}-plots-${{ hashFiles('src/plots.jl', 'src/data.jl') }}
          restore-keys: |
            ${{ runner.os }}-plots-

      - name: Install Julia dependencies
        run: |
          xvfb-run -a julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.precompile()
          '

      - name: Generate plots
        run: |
          xvfb-run -a julia --project=. -e '
            using MarshallWildfire
            output_dir = joinpath(@__DIR__, "report", "images")
            mkpath(output_dir)

            # Helper to generate plot only if it does not exist
            function generate_if_missing(filename, plot_fn)
                path = joinpath(output_dir, filename)
                if !isfile(path)
                    @info "Generating $filename..."
                    plot_fn(; output_dir)
                else
                    @info "$filename already exists, skipping"
                end
            end

            generate_if_missing("marshall_fire_perimeter.png", MarshallWildfire.plot_marshall_perimeter)
            generate_if_missing("marshall_fire_with_buildings.png", MarshallWildfire.plot_perimeter_with_buildings)
            generate_if_missing("damage_assessment.png", MarshallWildfire.plot_damage_assessment)
            generate_if_missing("fuel_flammability.png", MarshallWildfire.plot_fuel_flammability)
            generate_if_missing("fuel_models.png", MarshallWildfire.plot_fuel_models)
            generate_if_missing("fuel_moisture.png", MarshallWildfire.plot_fuel_moisture)
            generate_if_missing("hrrr_wind.gif", MarshallWildfire.plot_hrrr_wind)

            # Landfire layers (multiple files)
            lf = MarshallWildfire.get_landfire_data()
            missing_layers = filter(k -> !isfile(joinpath(output_dir, "landfire_$k.png")), keys(lf))
            if !isempty(missing_layers)
                @info "Generating landfire layer plots..."
                MarshallWildfire.plot_landfire_layers(; output_dir)
            else
                @info "All landfire layer plots already exist, skipping"
            end
          '

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto site
        run: quarto render report/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: report/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
