project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - plots.qmd
    - datasets.qmd
    - levelset.qmd
    - vulnerability.qmd
    - fuelmodels.qmd
    - references.qmd

website:
  title: "Marshall Fire Analysis"
  navbar:
    right:
      - icon: github
        href: https://github.com/joshday/MarshallWildfire
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Home
      - section: "Analysis"
        contents:
          - href: plots.qmd
            text: Plots
          - href: datasets.qmd
            text: Datasets
          - href: vulnerability.qmd
            text: Vulnerability
      - section: "Methods"
        contents:
          - href: levelset.qmd
            text: Level Set Method
          - href: fuelmodels.qmd
            text: Fuel Models
      - href: references.qmd
        text: References

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    code-tools: true

execute:
  freeze: auto
  warning: false

jupyter: julia-1.12
