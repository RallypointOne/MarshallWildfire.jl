project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - plots.qmd
    - datasets.qmd
    - levelset.qmd

website:
  title: "Marshall Fire Analysis"
  navbar:
    right:
      - icon: github
        href: https://github.com/joshday/MarshallWildfire
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Home
      - section: "Analysis"
        contents:
          - href: plots.qmd
            text: Plots
          - href: datasets.qmd
            text: Datasets
      - section: "Methods"
        contents:
          - href: levelset.qmd
            text: Level Set Method

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    code-tools: true

execute:
  freeze: auto

jupyter: julia-1.12
