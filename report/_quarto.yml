project:
  type: book
  output-dir: _site

book:
  title: "Marshall Fire Analysis"
  repo-url: https://github.com/RallypointOne/MarshallWildfire
  repo-actions: [source]
  chapters:
    - index.qmd
    - part: "Analysis"
      chapters:
        - plots.qmd
        - datasets.qmd
    - part: "Methods"
      chapters:
        - levelset.qmd
        - fuelmodels.qmd
        - pinns.qmd
    - references.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    code-tools: true
  pdf:
    toc: true
    documentclass: report
    colorlinks: true

execute:
  freeze: auto
  warning: false

jupyter: julia-1.12
